[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-local-rag"
version = "0.1.0"
description = "Local-first personal RAG system with Streamlit, SQLite, Ollama, and Telegram ingestion."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "notionhelper>=0.6.4",
  "readability-lxml>=0.8.1",
  "requests>=2.32.3",
  "streamlit>=1.44.0",
  "pypdf>=4.2.0",
  "sqlite-vec>=0.1.6",
  "langfuse>=3.3.1",
  "loguru>=0.7.3",
  "rich>=14.0.0",
  "watchfiles>=1.1.0",
]

[tool.setuptools.packages.find]
include = ["local_rag*", "watcher*"]
